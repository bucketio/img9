<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 478" width="760" height="478" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="th" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4F9C"/>
      <stop offset="100%" stop-color="#1A7A63"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a8a84"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="478" fill="#ffffff"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3932">智小星 · 数据团队负责的五层</text>
  <text x="653" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1B4F9C">TokenHub · 通用运行底座</text>

  <!-- layer 1 -->
  <rect x="20" y="48" width="520" height="72" rx="8" fill="#F1F7F4" stroke="#D4E9E2"/>
  <rect x="20" y="48" width="128" height="72" rx="8" fill="#006241"/>
  <text x="84" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">交互层</text>
  <text x="84" y="100" text-anchor="middle" font-size="11" fill="#D4E9E2">在哪里问</text>
  <text x="164" y="78" font-size="13" fill="#1E3932">PC 端（OAH 门户）· 移动端（绿围裙）· 飞书工作台（开发中）</text>
  <text x="164" y="100" font-size="12" fill="#55665f">对话 · 我的词典 · 定时任务 · 文件管理 · 技能库（待建）· 消息通知</text>

  <!-- layer 2 -->
  <rect x="20" y="130" width="520" height="72" rx="8" fill="#FBF6EA" stroke="#EAD9AE"/>
  <rect x="20" y="130" width="128" height="72" rx="8" fill="#1E3932"/>
  <text x="84" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Harness</text>
  <text x="84" y="182" text-anchor="middle" font-size="11" fill="#CBA258">怎么做才可靠</text>
  <text x="164" y="160" font-size="13" fill="#1E3932">问题对齐 · 证据组织 · 工具编排 · 验证交付</text>
  <text x="164" y="182" font-size="12" fill="#55665f">记忆的读取、更新与汰换嵌入任务流程</text>

  <!-- layer 3 -->
  <rect x="20" y="212" width="520" height="72" rx="8" fill="#F1F7F4" stroke="#D4E9E2"/>
  <rect x="20" y="212" width="128" height="72" rx="8" fill="#006241"/>
  <text x="84" y="244" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">语义层</text>
  <text x="84" y="264" text-anchor="middle" font-size="11" fill="#D4E9E2">听懂企业的话</text>
  <text x="164" y="242" font-size="13" fill="#1E3932">业务知识 · 247 个指标 · 22 个业务域</text>
  <text x="164" y="264" font-size="12" fill="#55665f">数据字典 · 分析框架 · 个人词典</text>

  <!-- app-side cross-session memory, spanning Harness and semantic layers -->
  <rect x="446" y="138" width="86" height="138" rx="10" fill="#ffffff" stroke="#CBA258" stroke-width="1.6" stroke-dasharray="5 3"/>
  <g text-anchor="middle">
    <text x="489" y="168" font-size="13" font-weight="700" fill="#8a6a26">跨会话</text>
    <text x="489" y="188" font-size="13" font-weight="700" fill="#8a6a26">持久记忆</text>
    <text x="489" y="218" font-size="12" fill="#3d4d47">记什么</text>
    <text x="489" y="239" font-size="12" fill="#3d4d47">怎么用</text>
    <text x="489" y="260" font-size="12" fill="#3d4d47">何时忘</text>
  </g>

  <!-- layer 4 -->
  <rect x="20" y="294" width="520" height="72" rx="8" fill="#F1F7F4" stroke="#D4E9E2"/>
  <rect x="20" y="294" width="128" height="72" rx="8" fill="#2D6A55"/>
  <text x="84" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">数据服务层</text>
  <text x="84" y="346" text-anchor="middle" font-size="11" fill="#D4E9E2">安全地拿到数</text>
  <text x="164" y="324" font-size="13" fill="#1E3932">数据查询服务（MCP）</text>
  <text x="164" y="346" font-size="12" fill="#55665f">SQL 执行 · 元数据探查 · 权限与审计</text>

  <!-- layer 5 -->
  <rect x="20" y="376" width="520" height="72" rx="8" fill="#F1F7F4" stroke="#D4E9E2"/>
  <rect x="20" y="376" width="128" height="72" rx="8" fill="#3E7B66"/>
  <text x="84" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">数据底座</text>
  <text x="84" y="428" text-anchor="middle" font-size="11" fill="#D4E9E2">数据本身可信</text>
  <text x="164" y="406" font-size="13" fill="#1E3932">离线数仓 · 实时数仓 · 在线分析</text>
  <text x="164" y="428" font-size="12" fill="#55665f">规范建模 · 元数据完备 · 服务化与权限审计</text>

  <!-- TokenHub column: five evenly spaced capability cards -->
  <rect x="566" y="48" width="174" height="400" rx="10" fill="url(#th)"/>
  <g font-size="13" fill="#1B3A6B" text-anchor="middle">
    <rect x="580" y="64" width="146" height="64" rx="6" fill="#ffffff" opacity="0.94"/>
    <text x="653" y="92">模型网关</text><text x="653" y="111">多模型路由</text>
    <rect x="580" y="140" width="146" height="64" rx="6" fill="#ffffff" opacity="0.94"/>
    <text x="653" y="177">配额与计量</text>
    <rect x="580" y="216" width="146" height="64" rx="6" fill="#ffffff" opacity="0.94"/>
    <text x="653" y="244">Agent 运行时</text><text x="653" y="263">与沙箱</text>
    <rect x="580" y="292" width="146" height="64" rx="6" fill="#ffffff" opacity="0.94"/>
    <text x="653" y="329">会话管理</text>
    <rect x="580" y="368" width="146" height="64" rx="6" fill="#ffffff" opacity="0.94"/>
    <text x="653" y="405">工具接入</text>
  </g>

  <!-- connectors: Harness uses models and runtime; data services are reached through tool access -->
  <line x1="542" y1="166" x2="564" y2="166" stroke="#7a8a84" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <line x1="542" y1="330" x2="564" y2="330" stroke="#7a8a84" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)" marker-start="url(#ar)"/>

  <text x="380" y="470" text-anchor="middle" font-size="12" fill="#6b7280">左侧回答「业务问题怎样被正确地回答」（含跨会话记忆），右侧回答「Agent 怎样被稳定地运行」</text>
</svg>
